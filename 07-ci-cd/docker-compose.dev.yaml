services:
  postgres:
    ports:
      - "5432:5432" # host:container
  api:
    build:
      target: dev
    volumes:
      - ./api:/app
      - /app/node_modules
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmindata:/var/lib/pgadmin
volumes:
  pgadmindata:
