name: ci-07 # shown in the Actions tab

on:
  push:
    paths:
      - "07-ci-cd/**" # only run when something in project 07 changes
      - ".github/workflows/ci.yml" # ...or this file itself

jobs:
  test:
    runs-on: ubuntu-latest # a fresh GitHub-hosted VM for every run
    defaults:
      run:
        working-directory: 07-ci-cd/api # every `run:` step starts in this folder
    steps:
      - uses: actions/checkout@v4 # download the repo's code into the empty workspace

      - uses: actions/setup-node@v4 # install the Node version we use in the Dockerfile
        with:
          node-version: 24
          cache: npm # keep ~/.npm between runs, keyed by the lock file

      - run: npm ci # exact versions from the lock file
      - run: npm run lint
      - run: npm test
