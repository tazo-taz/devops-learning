name: ci-07 # shown in the Actions tab

on:
  push:
    branches: ["**"] # every branch runs the tests
    tags: ["v*"] # a git tag like v1.0.0 also starts a run (paths: is NOT checked for tags)
    paths:
      - "07-ci-cd/**" # only run when something in project 07 changes
      - ".github/workflows/ci.yml" # ...or this file itself

jobs:
  test:
    runs-on: ubuntu-latest # a fresh GitHub-hosted VM for every run
    defaults:
      run:
        working-directory: 07-ci-cd/api # every `run:` step starts in this folder
    steps:
      - uses: actions/checkout@v4 # download the repo's code into the empty workspace

      - uses: actions/setup-node@v4 # install the Node version we use in the Dockerfile
        with:
          node-version: 24
          cache: npm # keep ~/.npm between runs, keyed by the lock file
          cache-dependency-path: 07-ci-cd/api/package-lock.json # uses: ignores working-directory, so give the full path

      - run: npm ci # exact versions from the lock file
      - run: npm run lint
      - run: npm test

  build:
    needs: test # only starts if the test job passed
    # only main (reviewed code) and version tags make images; other branches stop after `test`
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest # a NEW fresh VM: nothing from the test job is here
    permissions:
      contents: read # checkout the code
      packages: write # allow GITHUB_TOKEN to push images to ghcr.io
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/devops-api # full image name, without a tag
    steps:
      - uses: actions/checkout@v4 # this VM is empty too, so check out again

      - uses: docker/setup-buildx-action@v3 # BuildKit builder (needed for --mount=type=secret, cache, push)

      - uses: docker/login-action@v3 # `docker login ghcr.io` with the token GitHub creates for every run
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5 # works out the tag list from the event (branch / git tag)
        id: meta # so later steps can read its output: steps.meta.outputs.tags
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
          # sha → always (full commit hash) | latest → only on main | semver → git tag v1.0.0 → image 1.0.0

      - uses: docker/build-push-action@v6
        with:
          context: 07-ci-cd/api # uses: ignores working-directory → full path from the repo root
          push: true # upload the image to the registry
          tags: ${{ steps.meta.outputs.tags }} # the list metadata-action built
          labels: ${{ steps.meta.outputs.labels }} # adds source repo + commit to the image metadata

  smoke:
    needs: build # test the image that was just pushed (skipped when build is skipped)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # pull our private image from ghcr.io
    defaults:
      run:
        working-directory: 07-ci-cd
    env:
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/devops-api:${{ github.sha }} # exactly this commit's image
      COMPOSE_FILE: docker-compose.yaml:docker-compose.ci.yaml # base + CI override (no dev/prod files)
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env from secrets # .env is git-ignored, so the runner doesn't have it
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }} # repo secret → masked as *** in the log
        run: |
          {
            echo "DB_USER=app"
            echo "DB_NAME=app"
            echo "DB_PASSWORD=$DB_PASSWORD"
          } > .env

      - name: Start the stack
        run: docker compose up -d --no-build # --no-build: pull our image, don't build it here

      - name: Smoke test through nginx
        run: |
          for i in $(seq 1 30); do # api waits for postgres + migrate, so retry for up to ~60s
            if curl -fsS http://localhost/api/users; then echo; echo "smoke test OK"; exit 0; fi
            sleep 2
          done
          echo "api never answered through nginx"; exit 1

      - name: Show logs if something failed
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=50

      - name: Stop the stack
        if: always() # clean up even after a failure
        run: docker compose down -v
