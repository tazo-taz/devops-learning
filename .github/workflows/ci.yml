name: ci-08 # shown in the Actions tab

on:
  push: # ONLY push (no pull_request) → code from forks never runs on my self-hosted runner
    branches: ["**"] # every branch runs the tests
    tags: ["v*"] # a git tag like v1.0.0 also starts a run (paths: is NOT checked for tags)
    paths:
      - "08-deploy-vps/**" # only run when something in project 08 changes
      - ".github/workflows/ci.yml" # ...or this file itself

jobs:
  test:
    runs-on: ubuntu-latest # a fresh GitHub-hosted VM for every run
    defaults:
      run:
        working-directory: 08-deploy-vps/api # every `run:` step starts in this folder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 08-deploy-vps/api/package-lock.json # uses: ignores working-directory

      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    needs: test
    # only main (reviewed code) and version tags make images; other branches stop after `test`
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # allow GITHUB_TOKEN to push images to ghcr.io
    strategy:
      matrix: # the same steps run twice in parallel: once per image
        include:
          - name: devops-api
            context: 08-deploy-vps/api
          - name: devops-web
            context: 08-deploy-vps/web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: 08-deploy-vps
    env:
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/devops-api:${{ github.sha }}
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/devops-web:${{ github.sha }}
      COMPOSE_FILE: docker-compose.yaml:docker-compose.ci.yaml # base + CI override (plain HTTP)
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env from secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          {
            echo "DB_USER=app"
            echo "DB_NAME=app"
            echo "DB_PASSWORD=$DB_PASSWORD"
          } > .env

      - name: Start the stack
        run: docker compose up -d --no-build

      - name: Smoke test through nginx
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost/api/users && curl -fsS -o /dev/null http://localhost/; then
              echo; echo "smoke test OK (api + web)"; exit 0
            fi
            sleep 2
          done
          echo "api or web never answered through nginx"; exit 1

      - name: Show logs if something failed
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=50

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  deploy:
    needs: smoke # only an image that passed the smoke test goes live
    if: github.ref == 'refs/heads/main' # tags make images but don't deploy (yet)
    runs-on: ubuntu-latest # the VPS has a public IP, so GitHub's own VMs can reach it (the local VM needed my self-hosted runner)
    environment: production # secrets SSH_KEY / SSH_HOST / SSH_USER / SSH_KNOWN_HOSTS live here
    concurrency: production # two pushes close together → deploys run one after the other, never at once
    defaults:
      run:
        working-directory: 08-deploy-vps
    env:
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/devops-api:${{ github.sha }}
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/devops-web:${{ github.sha }}
      TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Write the SSH key + known_hosts
        # $RUNNER_TEMP = this job's temp folder, NOT my ~/.ssh (the runner runs as me on my PC)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"   # create it private BEFORE writing the key
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          # every later ssh/scp uses ONLY this key and ONLY this known_hosts (no fallback to my own)
          echo "SSH_OPTS=-i $RUNNER_TEMP/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes" >> "$GITHUB_ENV"

      - name: Copy compose files + nginx config to the server
        # no source code, no .env, no certs: only what `docker compose` needs to run the images
        run: |
          scp $SSH_OPTS docker-compose.yaml docker-compose.prod.yaml docker-compose.live.yaml docker-compose.ci.yaml "$TARGET:app/"
          scp $SSH_OPTS -r nginx nginx-prod nginx-live scripts "$TARGET:app/"

      - name: Pull + start this commit's images
        # .env on the server = the CURRENT release: replace the two image lines, keep the secrets
        run: |
          ssh $SSH_OPTS "$TARGET" "set -e
            cd app
            sed -i '/^API_IMAGE=/d; /^WEB_IMAGE=/d' .env
            echo 'API_IMAGE=$API_IMAGE' >> .env
            echo 'WEB_IMAGE=$WEB_IMAGE' >> .env
            docker compose pull
            docker compose up -d --no-build --remove-orphans"

      - name: Check the live site
        run: |
          for i in $(seq 1 30); do
            # real DNS name + real Let's Encrypt cert: no --resolve, no -k needed
            if curl -fsS https://devops.tazojanelidze.xyz/api/users; then
              echo; echo "live site OK"; break
            fi
            [ "$i" = 30 ] && { echo "site not answering"; exit 1; }
            sleep 2
          done
          ssh $SSH_OPTS "$TARGET" "docker inspect -f '{{.Name}} → {{.Config.Image}}' app-api-1 app-web-1"

      - name: Remove the key from disk
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key"
