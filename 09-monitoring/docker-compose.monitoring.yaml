# the monitoring stack, added on top of the app's compose files (same network, so it can reach `api`)
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090" # UI only from this machine (a plain 9090:9090 would skip ufw, R85)
    volumes:
      - ./prometheus:/etc/prometheus:ro # the config, from git
      - promdata:/prometheus # the stored metrics survive a recreate
    restart: unless-stopped

  # translates Postgres' own statistics (connections, DB size, locks) into /metrics on port 9187
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_URI: postgres:5432/${DB_NAME}?sslmode=disable
      DATA_SOURCE_USER: exporter # its own read-only user, NOT the app's user
      DATA_SOURCE_PASS: ${EXPORTER_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # translates the HOST's numbers (CPU, RAM, disk, network) into /metrics on port 9100
  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host # read disk info from the mounted host root, not from its own container
    pid: host # see the host's processes
    volumes:
      - /:/host:ro # the host's whole filesystem, read-only
    restart: unless-stopped

volumes:
  promdata:
