# LIVE nginx (rented VPS, real domain + Let's Encrypt cert).
# Mounted by docker-compose.live.yaml instead of ./nginx-prod (which stays as the local-VM snapshot).

upstream api_backend {
    zone api_backend 64k;   # shared between all workers
    server api:3000;
}

# Port 80: two jobs only
server {
    listen 80;
    server_name devops.tazojanelidze.xyz;

    # 1) Let's Encrypt's check (HTTP-01): Certbot drops a token file in this folder on the host,
    #    Let's Encrypt fetches it over plain HTTP. Needed for every renewal (certs last 90 days).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 2) everything else: "go to the HTTPS version of the same URL"
    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: TLS ends here, then plain HTTP inside Docker
server {
    listen 443 ssl;
    server_name devops.tazojanelidze.xyz;

    # written + renewed by Certbot on the HOST, mounted read-only into this container
    ssl_certificate     /etc/letsencrypt/live/devops.tazojanelidze.xyz/fullchain.pem;   # cert + intermediate
    ssl_certificate_key /etc/letsencrypt/live/devops.tazojanelidze.xyz/privkey.pem;     # private: only on the server
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://web:80/;
    }

    location /api/ {
        proxy_pass http://api_backend/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
