# Production nginx (server only, mounted by docker-compose.prod.yaml instead of ./nginx).
# CI keeps using ./nginx (plain HTTP) for its smoke test.

upstream api_backend {
    zone api_backend 64k;   # shared between all workers
    server api:3000;
}

# Port 80: no content, only "go to the HTTPS version of the same URL"
server {
    listen 80;
    server_name devops.test;
    return 301 https://$host$request_uri;
}

# Port 443: TLS ends here, then the same routes as before (plain HTTP inside Docker)
server {
    listen 443 ssl;
    server_name devops.test;

    ssl_certificate     /etc/nginx/certs/devops.test.crt;   # public: sent to every client
    ssl_certificate_key /etc/nginx/certs/devops.test.key;   # private: never in git
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://web:80/;
    }

    location /api/ {
        proxy_pass http://api_backend/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # now "https"
    }
}
